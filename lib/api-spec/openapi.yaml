openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chat
    description: Nexo AI chat
  - name: agent
    description: Nexo Agent
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat:
    post:
      operationId: streamChat
      tags: [chat]
      summary: Stream an AI chat response
      parameters:
        - in: header
          name: X-Groq-Api-Key
          required: true
          description: Groq credential saved by this user in browser settings; forwarded only for this request.
          schema:
            type: string
            minLength: 8
            maxLength: 512
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Server-sent JSON events containing final-answer content, separate reasoning deltas returned by Groq when supported, activity with id/label/kind/status, sources, model metadata, notice with id/message/model for fallbacks, done, or error. Reasoning is the provider-exposed trace, not a generated summary or a claim of access to unexposed internals. Web search is external and selective.
          content:
            text/event-stream: {}
        "400":
          description: Invalid conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Groq API key is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Groq is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Groq rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /chat/image:
    post:
      operationId: streamImageChat
      tags: [chat]
      summary: Stream an image-aware AI chat response
      description: Image-bearing prompts use the caller's Gemini API key for this request. The API server does not persist provider keys.
      parameters:
        - in: header
          name: X-Gemini-Api-Key
          required: true
          description: Gemini credential saved by this user in browser settings; forwarded only for this request.
          schema:
            type: string
            minLength: 8
            maxLength: 512
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageChatInput"
      responses:
        "200":
          description: Server-sent JSON events containing answer text, activity, model metadata, done, or error.
          content:
            text/event-stream: {}
        "400":
          description: Invalid conversation or image payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Gemini API key is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Image request is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Gemini rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Gemini service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /agent:
    post:
      operationId: streamAgentChat
      tags: [agent]
      summary: Stream an Agent-mode response
      description: Uses the caller's Groq key and optional Gemini key for this request. Supports Gemini image analysis and a tool-free Gemma 4 review when a Gemini key is supplied. Model, task, and surfaced fallback persist through bounded web-search and isolated-browser tool continuations. Tool activity and sources are returned as SSE events; private model reasoning and image bytes are not exposed.
      parameters:
        - in: header
          name: X-Groq-Api-Key
          required: true
          description: Groq credential saved by this user in browser settings; forwarded only for this request.
          schema:
            type: string
            minLength: 8
            maxLength: 512
        - in: header
          name: X-Gemini-Api-Key
          required: false
          description: Optional Gemini credential saved by this user in browser settings; forwarded only for this request.
          schema:
            type: string
            minLength: 8
            maxLength: 512
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentChatInput"
      responses:
        "200":
          description: Server-sent JSON events containing answer text, provider/model changes, tool activity, sources, a browser code request, a bounded agentRetry handoff, completion, or a safe error. Retry handoffs carry completed history; clients wait and resend without executing tools again.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/AgentStreamEventEnvelope"
        "400":
          description: Invalid conversation or tool history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Groq API key is missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Agent image request is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Gemini or Groq Agent rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Gemini or an Agent tool failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini or Groq Agent fallback is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 12000
      required:
        - role
        - content
    ChatInput:
      type: object
      properties:
        deepthink:
          type: boolean
          default: false
          description: Use high reasoning effort instead of medium
        timeZone:
          type: string
          maxLength: 100
          description: Browser IANA timezone, validated by the server for current-time context
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - messages
    ImageChatInput:
      type: object
      properties:
        deepthink:
          type: boolean
          default: false
          description: Use high thinking level instead of medium
        timeZone:
          type: string
          maxLength: 100
          description: Browser IANA timezone, validated by the server for current-time context
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/ChatMessage"
        image:
          $ref: "#/components/schemas/ImageAttachment"
      required:
        - messages
        - image
    ImageAttachment:
      type: object
      properties:
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        data:
          type: string
          minLength: 4
          maxLength: 4194304
          pattern: '^[A-Za-z0-9+/]+={0,2}$'
          description: Base64-encoded image bytes without a data URL prefix
      required:
        - mimeType
        - data
    AgentChatInput:
      type: object
      properties:
        deepthink:
          type: boolean
          default: false
          description: Use high thinking level instead of medium
        agentProvider:
          type: string
          enum: [gemini, groq]
          description: Continue an Agent run on its selected provider after a rate-limit fallback
        agentModel:
          type: string
          maxLength: 100
          description: Continue an Agent run on its selected provider model
        agentTask:
          type: string
          enum: [coding, planning, reasoning, fast_worker, document, synthesis, classification, multimodal]
          description: Preserve the server-selected capability route through tool continuations
        agentRetryCount:
          type: integer
          minimum: 0
          maximum: 3
          description: Number of browser-side rate-limit deferrals already consumed in this build; never reset after a tool continuation. Presence also advertises that this client supports agentRetry SSE handoffs. Omit for legacy clients.
        timeZone:
          type: string
          maxLength: 100
          description: Browser IANA timezone, validated by the server for current-time context
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/ChatMessage"
        agentHistory:
          type: array
          maxItems: 6
          description: Bounded prior tool call and result pairs for the current Agent run.
          items:
            $ref: "#/components/schemas/AgentToolExchange"
        projectFiles:
          type: array
          maxItems: 8
          description: Only project files the user explicitly selected to share with Agent.
          items:
            $ref: "#/components/schemas/AgentProjectFile"
        image:
          $ref: "#/components/schemas/ImageAttachment"
        agentReview:
          $ref: "#/components/schemas/AgentReviewContext"
      required:
        - messages
    AgentStreamEventEnvelope:
      type: object
      description: One JSON payload inside an Agent SSE frame; other existing event fields remain supported.
      additionalProperties: true
      properties:
        agentRetry:
          $ref: "#/components/schemas/AgentRateLimitRetry"
    AgentRateLimitRetry:
      type: object
      required: [afterMs, history]
      properties:
        afterMs:
          type: integer
          minimum: 250
          maximum: 60250
          description: Explicit provider retry delay plus bounded safety margin, in milliseconds.
        history:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/AgentToolExchange"
    AgentReviewContext:
      type: object
      description: Bounded source and isolated-run results for a tool-free Gemma 4 code review.
      properties:
        language:
          type: string
          enum: [python, javascript, html]
        source:
          type: string
          maxLength: 24000
        output:
          type: string
          maxLength: 8000
        browserChecks:
          type: string
          maxLength: 4000
      required:
        - language
        - source
      additionalProperties: false
    AgentToolExchange:
      type: object
      properties:
        tool:
          type: string
          enum: [web_search, run_code, write_project]
        callId:
          type: string
          minLength: 1
          maxLength: 128
        thoughtSignature:
          type: string
          minLength: 1
          maxLength: 4096
        arguments:
          $ref: "#/components/schemas/AgentToolArguments"
        result:
          type: string
          maxLength: 8000
        sources:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AgentSource"
      required:
        - tool
        - callId
        - thoughtSignature
        - arguments
        - result
    AgentToolArguments:
      type: object
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 300
        language:
          type: string
          enum: [python, javascript, html]
        code:
          type: string
          minLength: 1
          maxLength: 20000
        entrypoint:
          type: string
          minLength: 1
          maxLength: 160
          description: Project file to run in the isolated browser.
        files:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/AgentProjectFile"
      additionalProperties: false
    AgentProjectFile:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 160
        content:
          type: string
          maxLength: 12000
      required:
        - path
        - content
      additionalProperties: false
    AgentSource:
      type: object
      properties:
        title:
          type: string
          maxLength: 300
        url:
          type: string
          format: uri
          maxLength: 2048
        retrieval:
          type: string
          enum: [page, search_excerpt]
        retrievedAt:
          type: string
          format: date-time
          description: When the search result was retrieved, not when the page was published
      required:
        - title
        - url
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

